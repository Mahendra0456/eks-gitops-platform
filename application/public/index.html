<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopKart</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6fa; color: #222; }
  header { background: #1e2a4a; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h2 { margin: 0; }
  main { display: grid; grid-template-columns: 3fr 1fr; gap: 20px; padding: 20px; max-width: 1100px; margin: auto; }
  #products { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; text-align: center; box-shadow: 0 1px 4px #0002; }
  .card .img { font-size: 48px; }
  button { background: #2d6cdf; color: #fff; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
  aside { background: #fff; border-radius: 10px; padding: 16px; height: fit-content; box-shadow: 0 1px 4px #0002; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><h2>ShopKart</h2><span id="status"></span></header>
<main>
  <section><div id="products">Loading...</div></section>
  <aside>
    <h3>Cart</h3>
    <div id="cart">Empty</div>
    <p><b>Total: ₹<span id="total">0</span></b></p>
    <button id="checkout" type="button">Checkout</button>
    <p id="msg"></p>
  </aside>
</main>
<script>
(function () {
  var cart = {};
  var products = [];
  var byId = function (id) { return document.getElementById(id); };

  function node(tag, text, cls) {
    var e = document.createElement(tag);
    if (text !== undefined) { e.textContent = text; }
    if (cls) { e.className = cls; }
    return e;
  }

  function renderProducts() {
    var box = byId('products');
    box.textContent = '';
    products.forEach(function (p) {
      var card = node('div', undefined, 'card');
      card.appendChild(node('div', p.image, 'img'));
      card.appendChild(node('h4', p.name));
      card.appendChild(node('p', '₹' + p.price));
      var btn = node('button', 'Add');
      btn.type = 'button';
      btn.addEventListener('click', function () { cart[p._id] = (cart[p._id] || 0) + 1; renderCart(); });
      card.appendChild(btn);
      box.appendChild(card);
    });
  }

  function renderCart() {
    var box = byId('cart');
    var total = 0;
    box.textContent = '';
    var ids = Object.keys(cart);
    if (!ids.length) { box.textContent = 'Empty'; }
    ids.forEach(function (id) {
      var p = products.find(function (x) { return x._id === id; });
      if (!p) { return; }
      total += p.price * cart[id];
      box.appendChild(node('div', p.name + ' x ' + cart[id]));
    });
    byId('total').textContent = String(total);
  }

  async function load() {
    try {
      var r = await fetch('/api/products');
      if (!r.ok) { throw new Error('bad status'); }
      products = await r.json();
      renderProducts();
    } catch (e) {
      byId('products').textContent = 'Could not load products.';
    }
    try {
      var h = await (await fetch('/health')).json();
      byId('status').textContent = 'DB: ' + h.db;
    } catch (e) {
      byId('status').textContent = 'DB: ?';
    }
  }

  async function checkout() {
    var items = Object.keys(cart).map(function (id) {
      var p = products.find(function (x) { return x._id === id; });
      return { productId: id, name: p.name, price: p.price, qty: cart[id] };
    });
    var r = await fetch('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: items, customer: 'guest' })
    });
    byId('msg').textContent = r.ok ? 'Order placed!' : 'Order failed';
    if (r.ok) { cart = {}; renderCart(); }
  }

  byId('checkout').addEventListener('click', checkout);
  load();
})();
</script>
</body>
</html>
